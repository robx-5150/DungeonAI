<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DungeonAI: The Dungeon Heart</title>
  <link rel="stylesheet" href="heart.css">
</head>
<body>
  <main class="heart-scene">
    <canvas id="heart" aria-label="The Dungeon Heart, pulsing at the centre of the dungeon"></canvas>
    <section class="heart-voice" aria-live="polite">
      <p id="heart-line"></p>
    </section>
    <footer class="heart-status">
      <span id="heart-mode">Demo feed</span>
    </footer>
  </main>
  <script src="heart.js"></script>
</body>
</html>
